name: technicq-support
services:
  support:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8091
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://support.technicq.net}
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8091}:8091"
    volumes:
      - support-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  support-data:
